name: Feature Request
description: Request a new feature for the OpenTelemetry Sandbox Web JS repository
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!
        
        **Important:** This is a sandbox repository for experimenting with Web JS optimizations.
        Features developed here may eventually be contributed back to the official repositories.
        
        Please search through [existing issues](https://github.com/open-telemetry/opentelemetry-sandbox-web-js/issues) 
        to see if your feature request is already reported.
  - type: textarea
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      value: |
        A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
        
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      value: |
        A clear and concise description of what you want to happen.
        
    validations:
      required: true
  - type: textarea
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      value: |
        A clear and concise description of any alternative solutions or features you've considered.
        
  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context or screenshots about the feature request here.
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0