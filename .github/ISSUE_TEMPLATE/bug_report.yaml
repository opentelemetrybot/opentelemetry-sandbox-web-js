name: Bug Report
description: File a bug report for the OpenTelemetry Sandbox Web JS repository
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
        
        **Important:** This is a sandbox repository for experimenting with Web JS optimizations.
        Code in this repository should NOT be used for production as it is subject to change.
        
        For production-level issues, please file them in the official repositories:
        - [OpenTelemetry JS](https://github.com/open-telemetry/opentelemetry-js)
        - [OpenTelemetry JS Contrib](https://github.com/open-telemetry/opentelemetry-js-contrib)
        
        Please search through [existing issues](https://github.com/open-telemetry/opentelemetry-sandbox-web-js/issues) 
        to see if your bug is already reported.
  - type: textarea
    attributes:
      label: What happened?
      description: Please provide as much detail as you reasonably can.
      value: |
        ## Steps to Reproduce
        
        ## Expected Result
        
        ## Actual Result
        
        ## Additional Details
        
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Please provide information about your environment
      value: |
        - OS: 
        - Browser: 
        - Node.js version: 
        - OpenTelemetry version: 
        
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant log output
      description: |
        Please copy and paste any relevant log output.
      render: shell
  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0